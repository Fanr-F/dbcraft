appId: com.dbcraft.app
productName: DBCraft
copyright: Copyright © 2026 fanzhouqi

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true

# better-sqlite3 是 N-API 预编译，不需要也不应让 electron-builder 重新 node-gyp 编译。
npmRebuild: false

# 离线环境直接复用 npm 安装的 Electron，避免 electron-builder 再下载 zip。
electronDist: node_modules/electron/dist

asarUnpack:
  - out/main/**
  - "**/*.node"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DBCraft

appId: com.dbcraft.app
productName: DBCraft
copyright: Copyright © 2026 fanzhouqi

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DBCraft
